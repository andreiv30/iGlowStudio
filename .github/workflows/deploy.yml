# Construiește site-ul la fiecare modificare pe main (inclusiv salvările din /admin)
# și pune rezultatul pe ramura `deploy`, împreună cu .cpanel.yml.
# Apoi cere cPanel-ului, prin API, „Update from Remote” + „Deploy HEAD Commit”,
# ca site-ul să ajungă singur în public_html (fără click-uri în cPanel).
#
# Secrete necesare (GitHub → Settings → Secrets and variables → Actions):
#   CPANEL_HOST   adresa cPanel, fără https:// și fără port (ex. server123.romarg.ro)
#   CPANEL_USER   utilizatorul cPanel (ex. elena44930)
#   CPANEL_TOKEN  token API din cPanel → Security → Manage API Tokens
# Fără ele, pasul automat e sărit și deploy-ul se face manual din cPanel.

name: Build pentru cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Optimizează pozele încărcate (WebP)
        run: node scripts/optimize-images.mjs

      - name: Salvează pozele optimizate pe main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- public/uploads src)" ]; then
            git add -A -- public/uploads src
            git commit -q -m "Optimizează imaginile încărcate (WebP)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          else
            echo "Nicio imagine nouă."
          fi

      - run: npm run build

      - name: Actualizează ramura deploy
        run: |
          if git fetch --depth=1 origin deploy:deploy 2>/dev/null; then
            git worktree add /tmp/out deploy
          else
            git worktree add --orphan -b deploy /tmp/out
          fi
          find /tmp/out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist /tmp/out/site
          cp cpanel/.cpanel.yml /tmp/out/.cpanel.yml
          cd /tmp/out
          git add -A
          if git diff --cached --quiet; then
            echo "Nicio schimbare în site."
            exit 0
          fi
          git commit -q -m "Site construit din ${GITHUB_SHA::7}"
          git push origin deploy

      - name: Publică pe server (cPanel)
        if: env.CPANEL_TOKEN != ''
        run: |
          ROOT="/home/${CPANEL_USER}/repositories/iGlowStudio"
          api() {
            curl -fsS --retry 3 --retry-delay 5 -G \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/$1" "${@:2}"
          }
          ok() { python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("errors") or "ok"); sys.exit(0 if d.get("status")==1 else 1)'; }
          echo "Update from Remote (ramura deploy)…"
          api VersionControl/update --data-urlencode "repository_root=${ROOT}" --data-urlencode "branch=deploy" | ok
          echo "Deploy HEAD Commit…"
          api VersionControlDeployment/create --data-urlencode "repository_root=${ROOT}" | ok
